<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Helixona systems directory" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <title>Helixona · Systems</title>
  <style>
    :root {
      --black: #050505; --ink: #141414; --text: #232120; --muted: #7a736a; --faint: #a8a197;
      --line: #e9e6e1; --line-strong: #d6d1c9; --ground: #ffffff; --panel: #f6f5f3;
      --gold: #d4b77a; --gold-line: #c4a368; --gold-tint: #faf6ec;
      --ok-bg: #dcefe3; --ok: #245f3d; --warn-bg: #fbecd2; --warn: #8a5210; --info-bg: #e2e9f4; --info: #2d4a70;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--ground); color: var(--text); font-family: "Jost", "Futura", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }
    a { color: inherit; }
    header { background: var(--black); color: #fff; flex: none; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .top { display: flex; align-items: center; gap: 22px; padding: 14px 0; }
    .top img { height: 28px; width: auto; display: block; }
    .top h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 24px; margin: 0; letter-spacing: 0.01em; padding-left: 22px; border-left: 1px solid rgba(255,255,255,0.18); }
    .top p { margin: 0; color: #c9c4bb; font-size: 13px; }
    .top .domain { margin-left: auto; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
    .search input { font: inherit; font-size: 13px; width: 240px; padding: 7px 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: #fff; }
    .search input::placeholder { color: #9b958c; }
    .search input:focus { outline: none; border-color: var(--gold); }
    main { flex: 1; min-height: 0; padding: 18px 0 10px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
    section { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; }
    .eyebrow { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); margin: 0; }
    section h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 22px; margin: 2px 0 2px; line-height: 1.1; }
    section .note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .card { position: relative; display: flex; flex-direction: column; gap: 5px; padding: 10px 12px 10px 15px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .15s, box-shadow .15s; overflow: hidden; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, var(--line-strong)); }
    .card.link:hover { border-color: var(--gold-line); box-shadow: 0 4px 14px rgba(18,18,18,0.08); }
    .card h3 a { text-decoration: none; }
    .card h3 a::after { content: ""; position: absolute; inset: 0; }
    .card .links, .card .pill { position: relative; z-index: 1; }
    .card.disabled { background: var(--panel); color: var(--muted); }
    .card .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.25; }
    .card p { margin: 0; font-size: 12px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .url { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { flex: none; font-size: 9.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; margin-top: 1px; }
    .pill.live { background: var(--ok-bg); color: var(--ok); }
    .pill.internal { background: var(--warn-bg); color: var(--warn); }
    .pill.external { background: var(--info-bg); color: var(--info); }
    .pill.soon { background: var(--line); color: var(--muted); }
    .card[data-status="live"] { --stripe: #2f7a4f; }
    .card[data-status="internal"] { --stripe: #b06a12; }
    .card[data-status="external"] { --stripe: #3a5f8f; }
    .card[data-status="soon"] { --stripe: var(--line-strong); }
    .tags { display: none; }
    .links { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .links a { font-size: 11.5px; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--gold-line); }
    .links a:hover { background: var(--gold-tint); }
    .empty { color: var(--muted); font-size: 14px; }
    footer { flex: none; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; padding: 8px 0 10px; }
    footer code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) {
      html, body { height: auto; } main { overflow: visible; }
      section { grid-template-columns: 1fr; gap: 8px; } .grid { grid-template-columns: 1fr; }
      .top { flex-wrap: wrap; gap: 10px; } .top h1 { padding-left: 0; border: 0; } .search input { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <img src="./logo-on-dark.png" alt="Helixona" />
      <h1>Systems</h1>
      <p>Every Helixona application, mockup and tool. Pick a card to open it in a new tab.</p>
      <span class="domain">bot.helixona.com</span>
      <div class="search"><input id="q" type="search" placeholder="Search…" autocomplete="off" /></div>
    </div>
  </header>

  <main class="wrap" id="root"></main>

  <footer>
    <div class="wrap">
      Internal directory for the Helixona team. To add or change a system, edit <code>systems.js</code> in the <a href="https://github.com/crpozo/helixona-main">helixona-main</a> repository. Mockups contain sample data only.
    </div>
  </footer>

  <script src="./systems.js"></script>
  <script>
    const STATUS_LABEL = { live: "Live", internal: "Internal", external: "External", soon: "Coming soon" };
    const root = document.getElementById("root");
    const q = document.getElementById("q");

    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    function cardHTML(it) {
      const has = it.url && it.status !== "soon";
      const title = has ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name);
      const url = has ? `<div class="url">${esc(it.url.replace(/^https?:\/\//, ""))}</div>` : "";
      const tags = (it.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
      const links = (it.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("");
      return `<div class="card${has ? " link" : " disabled"}" data-status="${esc(it.status)}">
        <div class="head"><h3>${title}</h3><span class="pill ${esc(it.status)}">${STATUS_LABEL[it.status] || esc(it.status)}</span></div>
        <p>${esc(it.description)}</p>
        ${url}
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        ${links ? `<div class="links">${links}</div>` : ""}
      </div>`;
    }

    function render(filter) {
      const f = (filter || "").trim().toLowerCase();
      const groups = (window.HELIXONA_SYSTEMS || []).map(g => ({
        ...g,
        items: g.items.filter(it => !f || [it.name, it.description, ...(it.tags || []), it.url].join(" ").toLowerCase().includes(f)),
      })).filter(g => g.items.length);
      root.innerHTML = groups.length
        ? groups.map(g => `<section><div><p class="eyebrow">${g.items.length} ${g.items.length === 1 ? "item" : "items"}</p><h2>${esc(g.group)}</h2>${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}</div><div class="grid">${g.items.map(cardHTML).join("")}</div></section>`).join("")
        : `<p class="empty">Nothing matches “${esc(filter)}”.</p>`;
    }

    q.addEventListener("input", () => render(q.value));
    render("");
  </script>
</body>
</html>
