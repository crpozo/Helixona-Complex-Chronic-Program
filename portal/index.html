<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Helixona systems directory" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <title>Helixona · Systems</title>
  <style>
    :root {
      --black: #050505; --ink: #141414; --text: #232120; --muted: #7a736a; --faint: #a8a197;
      --line: #e9e6e1; --line-strong: #d6d1c9; --ground: #ffffff; --panel: #f6f5f3;
      --gold: #d4b77a; --gold-line: #c4a368; --gold-tint: #faf6ec;
      --ok-bg: #dcefe3; --ok: #245f3d; --warn-bg: #fbecd2; --warn: #8a5210; --info-bg: #e2e9f4; --info: #2d4a70;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ground); color: var(--text); font-family: "Jost", "Futura", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    header { background: var(--black); color: #fff; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; }
    .top img { height: 34px; width: auto; display: block; }
    .top .domain { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
    .hero { padding: 28px 0 36px; border-top: 1px solid rgba(255,255,255,0.08); }
    .hero h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 40px; margin: 0 0 8px; letter-spacing: 0.005em; }
    .hero p { margin: 0; color: #c9c4bb; max-width: 640px; font-size: 16px; }
    .search { margin-top: 22px; display: flex; gap: 10px; max-width: 520px; }
    .search input { flex: 1; font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: #fff; }
    .search input::placeholder { color: #9b958c; }
    .search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,183,122,0.35); }
    main { padding: 36px 0 60px; }
    section { margin-bottom: 40px; }
    .eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); margin: 0 0 4px; }
    section h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 28px; margin: 0 0 4px; }
    section .note { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px 22px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; overflow: hidden; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--stripe, var(--line-strong)); }
    .card.link:hover { border-color: var(--gold-line); box-shadow: 0 6px 18px rgba(18,18,18,0.08); transform: translateY(-1px); }
    .card h3 a { text-decoration: none; }
    .card h3 a::after { content: ""; position: absolute; inset: 0; }   /* whole card opens the main link */
    .card .links, .card .pill { position: relative; z-index: 1; }
    .card.disabled { background: var(--panel); color: var(--muted); }
    .card .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
    .card p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
    .card .url { font-size: 12px; color: var(--faint); word-break: break-all; }
    .pill { flex: none; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .pill.live { background: var(--ok-bg); color: var(--ok); }
    .pill.internal { background: var(--warn-bg); color: var(--warn); }
    .pill.external { background: var(--info-bg); color: var(--info); }
    .pill.soon { background: var(--line); color: var(--muted); }
    .card[data-status="live"] { --stripe: #2f7a4f; }
    .card[data-status="internal"] { --stripe: #b06a12; }
    .card[data-status="external"] { --stripe: #3a5f8f; }
    .card[data-status="soon"] { --stripe: var(--line-strong); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 2px; }
    .links a { font-size: 13px; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--gold-line); }
    .links a:hover { background: var(--gold-tint); }
    .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 20px 0 40px; }
    footer code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
    @media (max-width: 600px) { .hero h1 { font-size: 32px; } .top img { height: 28px; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="top">
        <img src="./logo-on-dark.png" alt="Helixona" />
        <span class="domain">bot.helixona.com</span>
      </div>
      <div class="hero">
        <h1>Systems</h1>
        <p>Every Helixona application, mockup and tool in one place. Pick a card to open it.</p>
        <div class="search"><input id="q" type="search" placeholder="Search by name, description or tag…" autocomplete="off" /></div>
      </div>
    </div>
  </header>

  <main class="wrap" id="root"></main>

  <footer>
    <div class="wrap">
      Internal directory for the Helixona team. To add or change a system, edit <code>systems.js</code> in the <a href="https://github.com/crpozo/helixona-main">helixona-main</a> repository. Mockups contain sample data only.
    </div>
  </footer>

  <script src="./systems.js"></script>
  <script>
    const STATUS_LABEL = { live: "Live", internal: "Internal", external: "External", soon: "Coming soon" };
    const root = document.getElementById("root");
    const q = document.getElementById("q");

    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    function cardHTML(it) {
      const has = it.url && it.status !== "soon";
      const title = has ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name);
      const url = has ? `<div class="url">${esc(it.url.replace(/^https?:\/\//, ""))}</div>` : "";
      const tags = (it.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
      const links = (it.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("");
      return `<div class="card${has ? " link" : " disabled"}" data-status="${esc(it.status)}">
        <div class="head"><h3>${title}</h3><span class="pill ${esc(it.status)}">${STATUS_LABEL[it.status] || esc(it.status)}</span></div>
        <p>${esc(it.description)}</p>
        ${url}
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        ${links ? `<div class="links">${links}</div>` : ""}
      </div>`;
    }

    function render(filter) {
      const f = (filter || "").trim().toLowerCase();
      const groups = (window.HELIXONA_SYSTEMS || []).map(g => ({
        ...g,
        items: g.items.filter(it => !f || [it.name, it.description, ...(it.tags || []), it.url].join(" ").toLowerCase().includes(f)),
      })).filter(g => g.items.length);
      root.innerHTML = groups.length
        ? groups.map(g => `<section><p class="eyebrow">${g.items.length} ${g.items.length === 1 ? "item" : "items"}</p><h2>${esc(g.group)}</h2>${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}<div class="grid">${g.items.map(cardHTML).join("")}</div></section>`).join("")
        : `<p class="empty">Nothing matches “${esc(filter)}”.</p>`;
    }

    q.addEventListener("input", () => render(q.value));
    render("");
  </script>
</body>
</html>
